name: Backup Pijul from Nest
on:
  schedule:
    - cron: '0 3 * * *'  # Tous les jours à 3h du matin
  workflow_dispatch:      # Permet de déclencher manuellement pour tester

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Permet de pousser vers le dépôt GitHub
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make libsodium-dev libclang-dev pkg-config libssl-dev libxxhash-dev libzstd-dev clang

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Pijul and pijul-export
        run: |
          source $HOME/.cargo/env
          cargo install pijul --version "~1.0.0-beta" --force
          cargo install --git https://nest.pijul.com/laumann/pijul-export --force

      - name: Clone from Nest via HTTPS
        run: |
          source $HOME/.cargo/env
          # On retire le "https://" pour contourner un bug de Pijul
          pijul clone nest.pijul.com/sasoricfa7-coder/EVANA /tmp/eva-pijul

      - name: Convert to Git and push
        run: |
          mkdir /tmp/eva-git && cd /tmp/eva-git
          git init
          # On force le canal 'main' au cas où le canal par défaut soit différent
          pijul-export --repo /tmp/eva-pijul --channel main | git fast-import
          git checkout main
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main --force
